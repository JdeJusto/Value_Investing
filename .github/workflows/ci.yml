name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (no database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Pipfile.lock

      - name: Install Python dependencies
        # This project has no pyproject.toml: the dependency set lives in
        # Pipfile. pipenv install --dev needs libmagic1 on the runner.
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update && sudo apt-get install -y libmagic1
          pip install pipenv
          pipenv install --system --deploy --dev

      - name: Run the unit suite
        # FINANCIAL_DATABASE_URL is deliberately left UNSET: the tests that
        # need a live database skip themselves when it is absent. Setting it to
        # an empty string is NOT equivalent — it would be read as a URL.
        run: python -m pytest tests/unit -q

  compile:
    name: Compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Byte-compile the sources
        run: python -m compileall -q backend scripts cli main.py

  frontend:
    name: Frontend (audit, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
