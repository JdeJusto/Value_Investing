# On-demand SEC refresh for analysis commands (refresh_service.py).
#
# Before analyzing explicit tickers, the CLI checks how fresh their data in
# Financial-DataBase is and, for stale companies, runs a *targeted*
# `sec sync <CIK>` per company (never a blanket full-universe sync).
# Current prices are always fetched on demand via PriceService and are
# NEVER persisted anywhere.
#
# Command-line overrides:
#   --refresh                 force refresh regardless of age
#   --no-refresh              skip the SEC sync step
#   --freshness-hours N       override freshness_max_age_hours
#   --refresh-workers N       override refresh_workers (daily_workflow)
#
# Environment overrides:
#   REFRESH_AUTO, FRESHNESS_MAX_AGE_HOURS, REFRESH_TIMEOUT_SECONDS,
#   REFRESH_SKIP_FLAG, REFRESH_WORKERS

# Refresh stale companies before analysis by default.
auto_refresh: true

# A company is "stale" when its most recent SEC ingestion timestamps
# (max(financial_facts.updated_at) / max(filings.created_at)) are older
# than this. 168h = 7 days, matching the weekly sync cadence.
freshness_max_age_hours: 168

# Per-company SEC sync timeout in seconds.
refresh_timeout_seconds: 300

# Global kill-switch equivalent to always passing --no-refresh.
skip_refresh_flag: false

# Concurrent targeted `sec sync <CIK>` subprocesses during refresh. 2 roughly
# halves refresh wall time vs sequential while keeping the SEC request burst
# small; raise to 3-4 on fast links only if SEC does not throttle.
refresh_workers: 2

# Consecutive tickers that fail with a NON-TRANSIENT Yahoo error (HTTP 429
# rate limit, or 401 invalid crumb) before the whole price stage gives up.
# Retrying those cannot help, and without this a universe run would burn
# 3 attempts and 3 s of backoff per ticker: 2 528 tickers is ~30 minutes of
# sleeping for a failure that was never transient. Set to 0 to disable the
# abort and keep retrying every ticker.
price_abort_after_consecutive_non_transient: 3

# Supplementary "not-from-canon" DCF sections (backend/valuation/).
#
# The DCF module is deliberately NOT part of any book methodology: it never
# appears in compare-methodologies, methodologies list, a composite score or
# a ranking. These toggles only control where its *supplementary* sections
# show up so it can be disabled without a code change.
#
# Environment overrides: DCF_IN_ANALYZE_FULL, DCF_IN_DAILY_REPORT,
# DCF_DAILY_REPORT_TOP_N.
dcf:
  in_analyze_full: true
  in_daily_report: true
  daily_report_top_n: 10