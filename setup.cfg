[flake8]
max-line-length = 100
exclude = .git,__pycache__,.venv,.env,venv,build,dist,*.egg-info
extend-ignore = E203, W503
per-file-ignores =
    alembic/env.py:E402
    ui/app.py:E402

[isort]
profile = black
line_length = 100

[black]
line-length = 100
target-version = py311

[tool:pytest]
testpaths = tests backend
python_files = test_*.py
